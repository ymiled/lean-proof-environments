[project]
name = "pdd"
version = "0.1.0"
description = "Measuring how model proof success decays with dependency depth in Lean 4"
# Both bounds are the training stack's, not ours; nothing in this package needs
# a feature newer than 3.11. They exist because `xgrammar`, which vllm pulls in,
# publishes wheels for one Python ABI at a time and no source distribution.
#
# The upper bound: uv picks the newest interpreter it can find on a fresh GPU
# host, which resolved to 3.14, for which no xgrammar wheel exists.
#
# The lower bound is the less obvious one. A lock spanning 3.11 and 3.12 has to
# name a single xgrammar version installable under both, and the newest such
# version is 0.2.4 -- which ships cp311 wheels only, so `uv sync` on a 3.12
# interpreter then fails on the very package the range was widened to
# accommodate. Pinning the lock to one minor version lets it resolve a current
# xgrammar. The CPU-only half of this package would run happily on 3.11, but a
# split bound would mean the environment and the trainer disagreed about the
# interpreter, which is worse than requiring one.
requires-python = ">=3.12,<3.13"
dependencies = ["matplotlib>=3.8", "anthropic>=0.40"]

# Training extras are optional and CUDA-only. Everything else in the package --
# the grader, the sampler, the reward, the parallel rollout collector and
# `pdd.sanity` -- runs on CPU with the base dependencies, which is what keeps
# environment development off the GPU.
# Two things below are load-bearing rather than cautious.
#
# The `trl<=0.24.0` cap is unsloth's, not ours. That trl imports
# `GuidedDecodingParams` from `vllm.sampling_params`, a name current vllm no
# longer defines -- it is now `StructuredOutputsParams`. No pair of released
# versions satisfies both, so `train_grpo._shim_vllm_guided_decoding` restores
# the name at import time. trl only dereferences it under
# `guided_decoding_regex`, which this project never sets.
#
# The `sys_platform == 'linux'` markers are required, not decorative. uv
# resolves universally across every platform the project claims to support, so
# without them it looks for a macOS solution for unsloth -- which has none, and
# which fails the whole resolve on a machine that will never train.
[project.optional-dependencies]
train = [
    "unsloth>=2026.8 ; sys_platform == 'linux'",
    "trl>=0.18.2,<=0.24.0 ; sys_platform == 'linux'",
    "datasets>=3.4.1,<4.4.0 ; sys_platform == 'linux'",
    "vllm>=0.21 ; sys_platform == 'linux'",
]

[tool.uv]
# uv resolves one lock that has to hold on every platform the project could
# conceivably run on, including ones nobody here uses. The `sys_platform ==
# 'linux'` markers below say unsloth and vllm are not *required* elsewhere, but
# a universal resolution still has to find some consistent version of them, and
# on a third platform there is none: recent unsloth pulls unsloth-zoo, which
# requires transformers>=5, while vllm requires transformers<5. The failure is
# reported against the training extra and reads as though linux were broken,
# which it is not -- linux resolves cleanly at both 3.11 and 3.12.
#
# Naming the two platforms that exist confines the resolution to them. The
# architecture is part of that: left unconstrained, the lock is free to satisfy
# linux with an aarch64-only xgrammar build, which then cannot be installed on
# the x86_64 host it was resolved for. `required-environments` is what forces
# uv to find wheels that actually work there rather than any wheel at all.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdd"]
