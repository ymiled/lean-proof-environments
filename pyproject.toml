[project]
name = "pdd"
version = "0.1.0"
description = "Measuring how model proof success decays with dependency depth in Lean 4"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdd"]
